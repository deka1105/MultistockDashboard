name: Keep backend warm

# Render's free tier spins the API down after ~15 min of no traffic, so the first
# request after an idle period 502s while the instance cold-starts (~30-60s). This
# job pings a light endpoint on a schedule to keep the instance awake, avoiding
# those cold-start errors for real users. Code can't remove spin-down — this does.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay/skip under load)
  workflow_dispatch: {}       # allow manual runs (used to verify the workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (wakes the instance)
        run: |
          URL="https://multistockdashboard.onrender.com/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "health attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "backend awake ✅"; ok=1; break; fi
            sleep 15
          done
          [ "${ok:-0}" = "1" ] || { echo "::error::backend did not return 200 (real outage?)"; exit 1; }

      - name: Warm the heavy caches (overview + screener)
        # Best-effort: these populate the per-ticker profile/financials caches
        # (30-min TTL) so real users hit warm cache and pages load fast. Failures
        # here don't fail the job — the health check above is the real gate.
        run: |
          BASE="https://multistockdashboard.onrender.com/api/v1"
          for path in \
            "stocks/market/overview" \
            "screener/?filters=%5B%5D&sort_by=market_cap&sort_dir=desc&page=1&per_page=25"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$BASE/$path" || echo 000)
            echo "warmed $path -> HTTP $code"
          done
